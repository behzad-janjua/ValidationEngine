<!DOCTYPE html>
<html>
<head>
    <title>Agent 1 - Idea Evaluator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px; margin: 5px; cursor: pointer; }
        .idea { border: 1px solid #ccc; padding: 10px; margin: 10px 0; cursor: pointer; }
        .idea:hover { background: #f0f0f0; }
        </style>
    </head>
    <body>
    <h1>Agent 1: Idea Evaluator</h1>
    
    <!-- Controls removed: page now auto-runs Agent 1 on load -->
    
    <div id="loading">Loading...</div>
    <div id="error" style="color: red;"></div>
    
    <div id="results"></div>
    
    <script>
        const API = '/api';
        
        async function analyzeFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) { alert('Select a file'); return; }
            
            const formData = new FormData();
            formData.append('excel', file);
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            
            try {
                const res = await fetch(`${API}/analyze`, { method: 'POST', body: formData });
                const data = await res.json();
                displayResults(data);
            } catch (e) {
                document.getElementById('error').textContent = 'Error: ' + e.message;
                document.getElementById('error').style.display = 'block';
            }
            document.getElementById('loading').style.display = 'none';
        }
        
        async function analyzeLocal() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            
            try {
                const res = await fetch(`${API}/analyze-local`, { method: 'POST' });
                const data = await res.json();
                displayResults(data);
            } catch (e) {
                document.getElementById('error').textContent = 'Error: ' + e.message;
                document.getElementById('error').style.display = 'block';
            }
            document.getElementById('loading').style.display = 'none';
        }
        
        // On load: use cached results if present, otherwise auto-run analyzeLocal
        window.addEventListener('load', () => {
            const cachedData = sessionStorage.getItem('agent1Results');
            if (cachedData) {
                analysisData = JSON.parse(cachedData);
                displayResults(analysisData);
                return;
            }

            analyzeLocal();
        });

        function displayTopByCategory(topByCategory) {
            if (!topByCategory) return;
            const div = document.getElementById('results');
            const section = document.createElement('div');
            section.innerHTML = '<h2>Top By Category</h2>';

            Object.entries(topByCategory).forEach(([category, items]) => {
                const catDiv = document.createElement('div');
                catDiv.innerHTML = `<h3>${category.charAt(0).toUpperCase() + category.slice(1)}</h3>`;
                const ul = document.createElement('ul');
                items.forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = `<b>${item.title}</b> — score: ${item.score} ${item.reason ? '— ' + item.reason : ''}`;
                    ul.appendChild(li);
                });
                catDiv.appendChild(ul);
                section.appendChild(catDiv);
            });

            div.appendChild(section);
        }

        function displayResults(data) {
            const div = document.getElementById('results');
            div.innerHTML = '<h2>Results (Click idea to analyze with Agent 2)</h2>';

            // Show top by category if available
            displayTopByCategory(data.analysis.topByCategory || data.analysis.top_by_category || data.analysis.topByCategory);

            // Normalize ratings array entries (support `scores` nesting)
            const ratings = (data.analysis.ratings || []).map(r => {
                const idea = { ...r };
                if (r.scores) {
                    idea.overall = r.scores.overall ?? r.overall;
                    idea.feasibility = r.scores.feasibility ?? r.feasibility;
                    idea.innovation = r.scores.innovation ?? r.innovation;
                    idea.impact = r.scores.impact ?? r.impact;
                    idea.marketability = r.scores.marketability ?? r.marketability;
                    idea.clarity = r.scores.clarity ?? r.clarity;
                }
                return idea;
            });

            ratings.sort((a, b) => (b.overall || 0) - (a.overall || 0)).forEach(idea => {
                const ideaDiv = document.createElement('div');
                ideaDiv.className = 'idea';
                ideaDiv.innerHTML = `
                    <h3>${idea.title}</h3>
                    <p>${idea.summary || ''}</p>
                    <p><b>Overall: ${idea.overall || 0}/10</b> | 
                       Feasibility: ${idea.feasibility || 0} | 
                       Innovation: ${idea.innovation || 0} | 
                       Impact: ${idea.impact || 0} | 
                       Marketability: ${idea.marketability || 0} | 
                       Clarity: ${idea.clarity || 0}</p>
                `;
                ideaDiv.onclick = () => {
                    sessionStorage.setItem('idea', JSON.stringify({
                        idea_index: idea.ideaIndex || idea.idea_index,
                        title: idea.title,
                        scores: {
                            feasibility: idea.feasibility,
                            innovation: idea.innovation,
                            impact: idea.impact,
                            marketability: idea.marketability,
                            clarity: idea.clarity,
                            overall: idea.overall
                        },
                        summary: idea.summary
                    }));
                    window.location.href = 'agent2.html';
                };
                div.appendChild(ideaDiv);
            });
        }
    </script>
</body>
</html>
